name: Rocketlane Timesheet Review (discovery)

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 13 * * 2,5'
    - cron: '0 13 * * 1,3'

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run Rocketlane API discovery
        env:
          ROCKETLANE_API_KEY: ${{ secrets.ROCKETLANE_API_KEY }}
          TRAY_WEBHOOK_URL: ${{ secrets.TRAY_WEBHOOK_URL }}
          MANAGER_FOLLOWUP_ONLY: ${{ github.event.schedule == '0 13 * * 1,3' }}
        run: node scripts/rocketlane-discover.js

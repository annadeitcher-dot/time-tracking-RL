name: Rocketlane Timesheet Review (discovery)

on:
  workflow_dispatch:
    inputs:
      manager_followup_only:
        description: 'Force manager escalation follow-up mode (for testing)'
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '0 13 * * 2,5'
    - cron: '0 13 * * 1,3'

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run Rocketlane API discovery
        env:
          ROCKETLANE_API_KEY: ${{ secrets.ROCKETLANE_API_KEY }}
          TRAY_WEBHOOK_URL: ${{ secrets.TRAY_WEBHOOK_URL }}
          MANAGER_FOLLOWUP_ONLY: ${{ github.event.inputs.manager_followup_only == 'true' || github.event.schedule == '0 13 * * 1,3' }}
        run: node scripts/rocketlane-discover.js
